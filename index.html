<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingolf Online Schack 1.8</title><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#10291e;color:#fff;font:16px system-ui}main{max-width:1050px;margin:auto;padding:12px}h1{color:#ffe28b}.panel{background:#234936;padding:15px;border-radius:13px;margin:10px 0}button,input,select{font:inherit;padding:9px;border:0;border-radius:7px;margin:4px}button{background:#f1cf74;cursor:pointer}input,select{background:white;color:#172e20}#game{display:grid;grid-template-columns:minmax(0,640px) 1fr;gap:12px}#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1/1;border:6px solid #795532;overflow:hidden}#board button{width:100%;height:100%;min-width:0;min-height:0;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;margin:0;border-radius:0;padding:0;font-size:clamp(27px,5vw,59px);text-shadow:0 1px 2px #888}.light{background:#f1dfb8}.dark{background:#9e7950}.lastfrom{box-shadow:inset 0 0 0 5px #ffdc66!important}.lastto{background:#e6b852!important;box-shadow:inset 0 0 0 5px #ffe582!important;animation:botmove 1.5s ease-in-out 2}@keyframes botmove{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}.selected{background:#f6d154!important}.target{box-shadow:inset 0 0 0 5px #33a060}.white{color:#fff;text-shadow:0 2px 2px #000,2px 0 2px #000!important}.black{color:#182327}#status{background:#f1cf74;color:#142c1b;font-size:20px;font-weight:bold;padding:12px;border-radius:9px}#moves{white-space:pre-wrap;line-height:1.8}@keyframes winblink{0%,100%{background:#f1cf74;color:#142c1b;transform:scale(1)}50%{background:#2de075;color:#10291e;transform:scale(1.035)}}#status.winblink{animation:winblink .7s ease-in-out infinite;text-align:center;font-size:clamp(22px,4vw,34px);box-shadow:0 0 22px #44ed81}.hidden{display:none!important}@media(max-width:750px){#game{grid-template-columns:1fr}#board button{font-size:clamp(25px,9vw,55px)}}</style><main><h1>♟ Ingolf Online Schack 1.8</h1><section id="lobby" class="panel"><p>Spela mot 🤖 Karlsson eller en vän via rumskod.</p><label>Ditt namn <input id="name" placeholder="Du"></label><select id="mode"><option value="bot">🤖 Karlsson</option><option value="online">Vän online</option><option value="local">Vän på samma skärm</option></select><button id="create">Starta / Skapa rum</button><p>Anslut till vän: <input id="code" placeholder="Rumskod"><button id="join">Anslut</button></p><p id="message"></p><div id="waiting" class="hidden"><strong id="room"></strong><p>Dela rumskoden med din vän.</p><button id="start" disabled>Starta partiet</button></div></section><section id="game" class="hidden"><div class="panel"><div id="status"></div><div id="board"></div><p>Välj pjäs och sedan mål-ruta.</p></div><div class="panel"><h2 id="players"></h2><button id="flip">Vänd brädet</button><button id="restart">Nytt parti</button><h3>Draglista</h3><div id="moves"></div></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),icons={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};let chess,selected=null,flipped=false,mode='',peer,conn,white='Du',black='Karlsson',busy=false,botTimeout=null,lastMove=null,botNotice='';const pieceNames={p:'Bonde',n:'Springare',b:'Löpare',r:'Torn',q:'Dam',k:'Kung'};const formatMove=m=>m?((m.color==='w'?'Vit: ':'Svart: ')+pieceNames[m.piece]+' '+m.from+'-'+m.to+(m.captured?' (slår)':'')+(m.promotion?' = '+pieceNames[m.promotion]:'')+(m.san.includes('#')?' schackmatt':m.san.includes('+')?' schack':'')):'';const say=x=>$('message').textContent=x;function begin(){clearTimeout(botTimeout);busy=false;if(mode==='bot'){const human=$('name').value.trim()||'Du';white=flipped?'Karlsson 🤖':human;black=flipped?human:'Karlsson 🤖'}chess=new Chess();selected=null;lastMove=null;botNotice='';$('lobby').classList.add('hidden');$('game').classList.remove('hidden');draw();bot()}function draw(){if(!chess)return;const board=$('board');board.innerHTML='';const rows=flipped?'12345678':'87654321',cols=flipped?'hgfedcba':'abcdefgh',targets=selected?chess.moves({square:selected,verbose:true}).map(m=>m.to):[];for(const r of rows)for(const c of cols){const sq=c+r,p=chess.get(sq),b=document.createElement('button');b.className=((c.charCodeAt(0)-97+Number(r))%2?'light':'dark')+(selected===sq?' selected':'')+(targets.includes(sq)?' target':'')+(lastMove?.from===sq?' lastfrom':'')+(lastMove?.to===sq?' lastto':'');b.title=sq;if(p){b.textContent=icons[p.color+p.type];b.classList.add(p.color==='w'?'white':'black')}b.onclick=()=>click(sq);board.append(b)}let st='Tur: '+(chess.turn()==='w'?white:black);if(chess.in_checkmate()){const winner=chess.turn()==='w'?'b':'w';const humanWon=(mode==='bot'&&winner===(flipped?'b':'w'))||(mode==='host'&&winner==='w')||(mode==='guest'&&winner==='b')||(mode==='local');st=humanWon?'🏆 Du vinner! 🎉':'🏆 Schackmatt! '+(winner==='w'?white:black)+' vann';$('status').classList.toggle('winblink',humanWon)}else{$('status').classList.remove('winblink');if(chess.in_draw())st='🤝 Remi';else if(chess.in_check())st+=' – SCHACK!'}$('status').textContent=chess.game_over()?st:(botNotice||st);$('players').textContent='♔ '+white+' – ♚ '+black;const h=chess.history({verbose:true});$('moves').textContent=Array.from({length:Math.ceil(h.length/2)},(_,i)=>(i+1)+'. '+formatMove(h[2*i])+(h[2*i+1]?'\n    '+formatMove(h[2*i+1]):'')).join('\n');}function allowed(){return !busy&&!chess.game_over()&&(mode==='local'||mode==='bot'&&chess.turn()===(flipped?'b':'w')||mode==='host'&&chess.turn()==='w'||mode==='guest'&&chess.turn()==='b')}function click(s){if(!allowed())return;const p=chess.get(s);if(selected){const opts=chess.moves({square:selected,verbose:true}).filter(m=>m.to===s);if(opts.length){let promotion='q';if(opts.some(m=>m.flags.includes('p'))){const v=(prompt('Bondeförvandling: q=drottning, r=torn, b=löpare, n=springare','q')||'q').toLowerCase();if('qrbn'.includes(v))promotion=v}move({from:selected,to:s,promotion});return}}selected=p&&p.color===chess.turn()?s:null;draw()}function move(m){const res=chess.move(m);if(!res)return;selected=null;lastMove={from:res.from,to:res.to};botNotice=mode==='bot'&&res.color===(flipped?'w':'b')?'🤖 Karlsson – '+formatMove(res):'';draw();if(mode==='guest')conn.send({t:'move',m});else if(mode==='host')conn.send({t:'state',history:chess.history()});bot()}function sync(history){if(!chess)begin();chess.reset();for(const m of history)chess.move(m);selected=null;lastMove=null;botNotice='';draw()}function bot(){if(mode!=='bot'||chess.turn()!==(flipped?'w':'b')||chess.game_over())return;busy=true;botNotice='🤖 Karlsson funderar på sitt drag…';draw();botTimeout=setTimeout(()=>{if(mode!=='bot'||chess.turn()!==(flipped?'w':'b')){busy=false;return}const moves=chess.moves({verbose:true});let best=-1e8,chosen=moves[0];for(const m of moves){chess.move(m);let score=0;const values={p:1,n:3,b:3.3,r:5,q:9,k:100};for(const row of chess.board())for(const p of row)if(p)score+=(p.color===(flipped?'w':'b')?1:-1)*values[p.type];if(chess.in_checkmate())score=chess.turn()===(flipped?'b':'w')?1e5:-1e5;chess.undo();score+=Math.random()*.5;if(score>best){best=score;chosen=m}}busy=false;if(chosen)move({from:chosen.from,to:chosen.to,promotion:chosen.promotion||'q'})},5000)}$('create').onclick=()=>{if(typeof Chess==='undefined')return say('Schackmotorn kunde inte laddas. Kontrollera internet.');white=$('name').value.trim()||'Du';mode=$('mode').value;if(mode==='bot'){black='Karlsson 🤖';begin()}else if(mode==='local'){black='Vän';begin()}else{mode='host';const code='ingolf-schack-'+Math.random().toString(36).slice(2,8);peer=new Peer(code);peer.on('open',id=>{say('Rumskod: '+id.replace('ingolf-schack-',''));$('room').textContent='Rum '+id.replace('ingolf-schack-','');$('waiting').classList.remove('hidden')});peer.on('connection',c=>{if(conn){c.close();return}conn=c;conn.on('open',()=>{say('Vän ansluten!');$('start').disabled=false});conn.on('data',x=>{if(x.t==='hello'){black=x.name||'Vän'}if(x.t==='move'&&chess?.turn()==='b'){const m=chess.move(x.m);if(m){draw();conn.send({t:'state',history:chess.history()})}}});conn.on('close',()=>say('Vännen kopplades från'))});peer.on('error',e=>say('Anslutningsfel: '+e.message))}};$('join').onclick=()=>{if(typeof Chess==='undefined')return say('Schackmotorn kunde inte laddas.');const code=$('code').value.trim().toLowerCase().replace('ingolf-schack-','');if(!code)return say('Ange rumskoden.');mode='guest';black=$('name').value.trim()||'Du';flipped=true;peer=new Peer();peer.on('open',()=>{conn=peer.connect('ingolf-schack-'+code,{reliable:true});conn.on('open',()=>{say('Ansluten. Väntar på spelstart.');conn.send({t:'hello',name:black})});conn.on('data',x=>{if(x.t==='start'){white=x.white;begin()}else if(x.t==='state')sync(x.history);else if(x.t==='reset')begin()});conn.on('error',e=>say(e.message))});peer.on('error',e=>say('Anslutningsfel: '+e.message))};$('start').onclick=()=>{if(mode==='host'&&conn?.open){begin();conn.send({t:'start',white})}};$('flip').onclick=()=>{if(mode==='bot'&&chess&&chess.history().length&&!confirm('Vända brädet och starta ett nytt parti med Karlsson som '+(flipped?'svart':'vit')+'?'))return;flipped=!flipped;if(mode==='bot')begin();else draw()};$('restart').onclick=()=>{if(mode==='guest')return alert('Be värden starta om partiet.');if(!confirm('Starta nytt parti?'))return;begin();if(mode==='host')conn.send({t:'reset'})};})();
</script></html>
